<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="CUETbyNTA has moved to cuetbynta.in. Visit the new website for CUET UG resources and updates.">
  <link rel="canonical" href="https://cuetbynta.in/">
  <meta http-equiv="refresh" content="8;url=https://cuetbynta.in/">
  <meta name="theme-color" content="#eaf3ff">
  <title>CUETbyNTA has moved</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #12213a;
      background: #eaf3ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 15% 10%, #fff 0, transparent 34%), #eaf3ff;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 56px);
      border: 3px solid #111827;
      border-radius: 26px;
      background: #fff;
      box-shadow: 9px 9px 0 #111827;
      text-align: center;
    }
    .brand {
      display: inline-block;
      margin-bottom: 28px;
      color: #1256b4;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: -.04em;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #52647d;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.04;
      letter-spacing: -.055em;
    }
    p {
      margin: 20px auto 0;
      max-width: 42ch;
      color: #48566b;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .new-address {
      display: inline-block;
      margin-top: 12px;
      color: #1256b4;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 850;
      overflow-wrap: anywhere;
    }
    .button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 12px 24px;
      border: 3px solid #111827;
      border-radius: 15px;
      background: #ffd34f;
      box-shadow: 4px 4px 0 #111827;
      color: #111827;
      font-size: 1rem;
      font-weight: 850;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .button:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #111827; }
    .button:focus-visible { outline: 4px solid #1256b4; outline-offset: 5px; }
    .countdown { margin-top: 22px; font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="CUETbyNTA">CUETbyNTA</div>
    <p class="eyebrow">Our website has moved</p>
    <h1>We have a new home.</h1>
    <p>CUETbyNTA is now at the address below. Update your bookmark and visit us there for CUET UG resources, practice and updates.</p>
    <a class="new-address" href="https://cuetbynta.in/">cuetbynta.in</a>
    <div><a class="button" href="https://cuetbynta.in/">Visit the new website <span aria-hidden="true">&nbsp;→</span></a></div>
    <p class="countdown">You’ll be redirected automatically in 8 seconds.</p>
  </main>
</body>
</html>
