<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentors' Portal | CUETbyNTA</title>
  <link rel="stylesheet" href="css/mentor.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="brand-panel">
      <div class="brand-mark">CUET<span>byNTA</span></div>
      <p class="eyebrow">MENTORS' PORTAL</p>
      <h1>Your mentorship,<br>your credentials.</h1>
      <p class="muted">Access your Letter of Recommendation, certificate and verification details from one place.</p>
    </section>

    <section class="login-card">
      <div class="mobile-brand">CUET<span>byNTA</span></div>
      <h2>Welcome back</h2>
      <p class="muted">Sign in to your mentor account.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>

        <button class="primary-btn" type="submit">Log in</button>
        <p id="loginMessage" class="form-message" role="alert"></p>
      </form>

      <p class="login-note">CUETbyNTA Mentors' Programme</p>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
