<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | CUETbyNTA</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#635bff,#c43fe8);font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px;color:#111827}.card{width:min(480px,100%);background:#fff;border-radius:22px;padding:42px;box-shadow:0 25px 70px #0003}.brand{font-size:24px;font-weight:800;margin-bottom:40px}.brand span{color:#7c3aed}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#7c3aed}h1{font-size:30px;margin:10px 0 12px}.muted{color:#64748b;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:20px 0 8px}input{width:100%;padding:14px;border:1px solid #d7dce5;border-radius:11px;font-size:15px}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:11px;background:linear-gradient(90deg,#635bff,#c43fe8);color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.55}.msg{margin-top:15px;font-size:14px;line-height:1.5}.ok{color:#15803d}.err{color:#b91c1c}.back{display:block;text-align:center;margin-top:20px;color:#64748b;text-decoration:none;font-size:13px}#resetView{display:none}</style></head><body><div class="card"><div class="brand">CUET<span>byNTA</span></div><div id="requestView"><div class="eyebrow">MENTORS' PORTAL</div><h1>Forgot your password?</h1><p class="muted">Enter your mentor account email and we'll send you a secure password reset link.</p><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button id="send">Send Reset Link</button><div id="msg" class="msg"></div><a class="back" href="login.html">← Back to login</a></div><div id="resetView"><div class="eyebrow">PASSWORD RESET</div><h1>Create a new password</h1><p class="muted">Choose a new password for your CUETbyNTA mentor account.</p><form id="form"><label>New password</label><input id="password" type="password" minlength="8" required><label>Confirm new password</label><input id="confirm" type="password" minlength="8" required><button id="update">Update Password</button><div id="resetMsg" class="msg"></div></form></div></div>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const s=createClient("https://sjetveelmoorrhxtlndt.supabase.co","sb_publishable_bJn6AT56orTZjj13dLCnqw_lPnRNvBl");
const req=document.getElementById("requestView"),rv=document.getElementById("resetView");
function recovery(){req.style.display="none";rv.style.display="block"}
if(location.hash.includes("type=recovery"))recovery();
s.auth.onAuthStateChange(e=>{if(e==="PASSWORD_RECOVERY")recovery()});
document.getElementById("send").onclick=async()=>{const email=document.getElementById("email").value.trim(),b=document.getElementById("send"),m=document.getElementById("msg");if(!email){m.className="msg err";m.textContent="Enter your email.";return}b.disabled=true;b.textContent="Sending...";const{error}=await s.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});b.disabled=false;b.textContent="Send Reset Link";m.className="msg "+(error?"err":"ok");m.textContent=error?error.message:"Reset link sent. Check your email, including Spam/Promotions."};
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const p=document.getElementById("password").value,c=document.getElementById("confirm").value,b=document.getElementById("update"),m=document.getElementById("resetMsg");if(p.length<8){m.className="msg err";m.textContent="Password must be at least 8 characters.";return}if(p!==c){m.className="msg err";m.textContent="Passwords do not match.";return}b.disabled=true;b.textContent="Updating...";const{error}=await s.auth.updateUser({password:p});if(error){b.disabled=false;b.textContent="Update Password";m.className="msg err";m.textContent=error.message;return}m.className="msg ok";m.textContent="Password updated successfully. Redirecting...";await s.auth.signOut();setTimeout(()=>location.href="login.html",1200)};
</script></body></html>
